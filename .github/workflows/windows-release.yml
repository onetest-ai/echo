# Echo for Windows on GitHub's runner: scripts/package-windows.ps1 in two phases (stage, then zip and MSI), then
# the MSI and the zip uploaded to the release. Not code-signed yet: a certificate (bought later) signs echoctl.exe
# between the phases and the MSI after the second — the phases are split for that.
#
# - A release published (from the Mac, with the dmg): builds the tag, uploads the Windows assets.
#   GitHub runs this file as it is in the tagged commit, so only tags made after it landed.
# - Run by hand (Actions -> Windows release -> Run workflow): the same for a tag given; upload off
#   to only get the files as a workflow artifact; no tag = build the branch it runs on, upload nothing.
# Nothing else builds: changes pile up on main and a release ships them. No cache either — a
# release run (a new tag each time) could read none but main's — so every release builds from
# scratch, ~25 minutes on GitHub's runner.
name: Windows release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (e.g. v0.5.6-beta); empty = this branch, nothing uploaded
        required: false
        default: ""
      upload:
        description: Upload the MSI and zip to that release
        type: boolean
        default: true


permissions:
  contents: write   # gh release upload

concurrency:
  group: windows-release-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  VULKAN_VERSION: 1.4.363.0
  WIX_VERSION: 5.0.2          # WiX 5: later versions carry a maintenance-fee EULA
  ECHO_BUILD_DIR: C:\eb       # short: the Vulkan shader generator's nested CMake hits MAX_PATH

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Which tag
        id: tag
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name || inputs.tag }}"
          $upload = "${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.upload && inputs.tag != '') }}"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "upload=$upload" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag || github.sha }}

      - name: Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Install the Vulkan SDK
        shell: pwsh
        run: |
          $v = $env:VULKAN_VERSION
          $exe = Join-Path $env:RUNNER_TEMP "vulkansdk-$v.exe"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$v/windows/vulkansdk-windows-X64-$v.exe" -OutFile $exe
          $sig = Get-AuthenticodeSignature $exe
          if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notmatch 'LunarG') { throw "the Vulkan SDK installer is not signed by LunarG ($($sig.Status))" }
          & $exe --root "C:\VulkanSDK\$v" --accept-licenses --default-answer --confirm-command install
          if ($LASTEXITCODE -ne 0) { throw "Vulkan SDK install failed ($LASTEXITCODE)" }

      - name: Tool paths
        shell: pwsh
        run: |
          "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_VERSION" >> $env:GITHUB_ENV
          "C:\VulkanSDK\$env:VULKAN_VERSION\Bin" >> $env:GITHUB_PATH
          # LLVM for bindgen (libclang only); the runner image has it, else install it.
          if (-not (Test-Path "C:\Program Files\LLVM\bin\libclang.dll")) { choco install llvm -y --no-progress }
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          "ECHO_STAGE_DIR=$env:RUNNER_TEMP\stage" >> $env:GITHUB_ENV
          dotnet tool install --global wix --version $env:WIX_VERSION


      - name: Build and stage
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Phase stage

      - name: Check the exe
        shell: pwsh
        run: |
          # An 8 MB main-thread stack (crates/echoctl/build.rs): 1 MB overflowed at start in 0.4.1-beta.
          $b = [IO.File]::ReadAllBytes("$env:ECHO_STAGE_DIR\echoctl.exe")
          $pe = [BitConverter]::ToInt32($b, 0x3C)
          $stack = [BitConverter]::ToUInt64($b, $pe + 24 + 72)
          if ($stack -ne 8388608) { throw "stack reserve is $stack, not 8 MB" }
          & "$env:ECHO_STAGE_DIR\echoctl.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "echoctl --version failed" }

      # A code-signing step for echoctl.exe goes here, before it goes into the zip and the MSI.

      - name: Zip and MSI
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Phase package

      # A code-signing step for the MSI goes here.

      - name: Keep the files
        uses: actions/upload-artifact@v4
        with:
          name: echo-windows-x64
          path: |
            dist\*.msi
            dist\*.zip
          if-no-files-found: error
          # A release's files live on the release; a build by hand without one is only for a look.
          retention-days: ${{ steps.tag.outputs.upload == 'true' && 90 || 7 }}

      - name: Upload to the release
        if: steps.tag.outputs.upload == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          gh release upload $tag (Get-ChildItem dist\*.msi, dist\*.zip).FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw "upload failed" }
