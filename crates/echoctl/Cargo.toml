[package]
name = "echoctl"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["transcribe", "tray"]
# Menu-bar (macOS) / notification-area (Windows) icon shown by `echoctl watch`.
tray = ["dep:tray-icon", "dep:tao", "dep:wry", "dep:portable-pty"]
# On-device transcription (whisper.cpp). Needs a C/C++ toolchain + cmake for the target, so
# cross-checks from macOS to Windows run with --no-default-features.
transcribe = ["dep:whisper-rs", "dep:ureq", "dep:libloading"]
# Windows / Linux: whisper.cpp on the GPU through Vulkan (NVIDIA, AMD, Intel). Building needs the
# Vulkan SDK (VULKAN_SDK); running needs vulkan-1.dll, which GPU drivers install.
vulkan = ["transcribe", "whisper-rs/vulkan"]

[dependencies]
# Echo cancellation of the mic track against the call app's track (pure-Rust WebRTC AEC3 port).
aec3 = "0.4"
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
# PKCE verifier / OAuth state for the Microsoft 365 sign-in.
getrandom = "0.3"
cpal = "0.18"
# Canonical paths without Windows' `\?\` prefix (they are stored and passed to other tools).
dunce = "1"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
ctrlc = { version = "3", features = ["termination"] }
sha2 = "0.10"
# Transcription server client (`remote.rs`): http or https (rustls; the OS's certificate store, so
# company TLS proxies work).
ureq = { version = "3.4", default-features = false, features = ["rustls", "platform-verifier"], optional = true }
# NVIDIA's NeMo-Speech runtime (`nemo.rs`), loaded when a Nemotron model is used.
libloading = { version = "0.8", optional = true }
tray-icon = { version = "0.26", optional = true }
tao = { version = "0.37", optional = true }
# The Echo window (calls, notes, transcript, settings): the system webview (WKWebView / WebView2)
# on the tray's own tao event loop.
wry = { version = "0.57", default-features = false, optional = true }
# Claude Code (and a shell) inside the Echo window: a pseudo-terminal per session (`terminal.rs`;
# macOS PTY, Windows ConPTY), shown with xterm.js.
portable-pty = { version = "0.9", optional = true }
# The minutes page (`minutes.rs`): Markdown parsed (our own writer escapes), screenshots embedded.
pulldown-cmark = { version = "0.13", default-features = false }
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSDictionary", "NSUUID", "NSValue", "NSObject", "NSData", "NSError", "NSRunLoop", "NSObjCRuntime"] }
# Notifications posted as Echo (its icon; a click opens the window). osascript's show as Script Editor.
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "bitflags", "block2", "UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationTrigger"] }
# The Dock icon while the Echo window is open (dev builds have no bundle icon).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSImage"] }
objc2-core-audio = { version = "0.3", features = ["AudioHardware", "objc2", "objc2-foundation", "objc2-core-audio-types"] }
objc2-core-audio-types = "0.3"
objc2-core-foundation = { version = "0.3", features = ["CFDictionary", "CFString"] }
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }
block2 = "0.6"
libc = "0.2"
whisper-rs = { version = "0.16", features = ["metal"], optional = true }
# Shared-screen key frames: decode the window capture, compare thumbnails, save JPEGs.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.16", optional = true }

# Echo's icon in echoctl.exe (build.rs; a host dependency, so only Windows builds compile it).
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Data_Xml_Dom",
  "Foundation",
  "UI_Notifications",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
] }
