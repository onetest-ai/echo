[package]
name = "echoctl"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["transcribe", "decode", "tray", "intake", "js"]
# Menu-bar (macOS) / notification-area (Windows) icon shown by `echoctl watch`.
tray = ["dep:tray-icon", "dep:tao", "dep:wry", "dep:portable-pty", "dep:objc2-web-kit", "dep:webview2-com"]
# On-device transcription (whisper.cpp). Needs a C/C++ toolchain + cmake for the target, so
# cross-checks from macOS to Windows run with --no-default-features.
transcribe = ["dep:whisper-rs", "dep:ureq", "dep:libloading"]
# Compressed audio for a plugin's `ctx.speech.transcribe` (webm/opus, ogg, m4a, mp3), decoded in pure Rust (Symphonia).
decode = ["transcribe", "dep:symphonia", "dep:symphonia-opus"]
# Intake and the search index over a SQLite store (FTS5). SQLite is C, so cross-checks from macOS to
# Windows run without it (--no-default-features), as without whisper.cpp.
intake = ["dep:rusqlite", "dep:zip", "dep:quick-xml", "dep:calamine", "dep:pdfium-render", "dep:icu_normalizer"]
# The old name, kept so `--features tray,brain` still builds.
brain = ["intake"]
# Plugins' host halves in JavaScript (QuickJS), with their WebSocket and pinned TLS to the addresses the user listed.
js = ["dep:rquickjs", "dep:tungstenite", "dep:rustls", "dep:rustls-platform-verifier", "dep:webpki", "dep:encoding_rs"]
# Windows / Linux: whisper.cpp on the GPU through Vulkan (NVIDIA, AMD, Intel). Building needs the
# Vulkan SDK (VULKAN_SDK); running needs vulkan-1.dll, which GPU drivers install.
vulkan = ["transcribe", "whisper-rs/vulkan"]

[dependencies]
# Echo cancellation of the mic track against the call app's track (pure-Rust WebRTC AEC3 port).
aec3 = "0.4"
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
# The user's Downloads folder as the system names it (a moved one too): where the window's exports go.
dirs = "7"
# PKCE verifier / OAuth state for the Microsoft 365 sign-in.
getrandom = "0.3"
cpal = "0.18"
# Canonical paths without Windows' `\?\` prefix (they are stored and passed to other tools).
dunce = "1"
hound = "3.5"
symphonia = { version = "0.6", default-features = false, features = ["mkv", "ogg", "isomp4", "aac", "mp3"], optional = true }
symphonia-opus = { version = "0.1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
ctrlc = { version = "3", features = ["termination"] }
sha2 = "0.10"
# The Brain's store (`brain/`): SQLite with FTS5, compiled in (no system library).
rusqlite = { version = "0.37", features = ["bundled"], optional = true }
# The window's search folds a Latin letter's accents as the store's tokenizer does (already built for URLs' hosts).
icu_normalizer = { version = "2.3", default-features = false, features = ["compiled_data"], optional = true }
# Transcription server client (`remote.rs`): http or https (rustls; the OS's certificate store, so
# company TLS proxies work).
ureq = { version = "3.4", default-features = false, features = ["rustls", "platform-verifier"], optional = true }
# NVIDIA's NeMo-Speech runtime (`nemo.rs`), loaded when a Nemotron model is used.
libloading = { version = "0.8", optional = true }
tray-icon = { version = "0.26", optional = true }
tao = { version = "0.37", optional = true }
# The Echo window (calls, notes, transcript, settings): the system webview (WKWebView / WebView2)
# on the tray's own tao event loop.
wry = { version = "0.57", default-features = false, optional = true }
# Claude Code (and a shell) inside the Echo window: a pseudo-terminal per session (`terminal.rs`;
# macOS PTY, Windows ConPTY), shown with xterm.js.
portable-pty = { version = "0.9", optional = true }
# The minutes page (`minutes.rs`): Markdown parsed (our own writer escapes), screenshots embedded.
pulldown-cmark = { version = "0.13", default-features = false }
base64 = "0.22"
# Thread folders in Intake (`intake/files/`): Office files read from their XML, spreadsheets, and PDF
# pages (text layer, page objects, images) through PDFium, loaded at runtime (BSD; no link-time dependency).
zip = { version = "9.1.3", default-features = false, features = ["deflate"], optional = true }
quick-xml = { version = "0.42.0", optional = true }
calamine = { version = "0.37.0", optional = true }
pdfium-render = { version = "0.9.4", optional = true }
# Plugins' host halves (`plugins/host.rs`): JavaScript run by QuickJS inside Echo (C, compiled in; so the
# Windows cross-check runs without it, as without SQLite).
rquickjs = { version = "0.14", default-features = false, features = ["classes", "properties"], optional = true }
# A web page read for a plugin (`jshost/web.rs`) in the charset it says it is in (already built for the Brain).
encoding_rs = { version = "0.8", optional = true }
# A host half's WebSocket to an address the user listed (`jshost/net.rs`): the protocol only; TLS is rustls below.
tungstenite = { version = "0.27", default-features = false, features = ["handshake"], optional = true }
# wss:// for a host half: the OS's certificate store, or the key the user pinned for that address (`jshost/tls.rs`).
# ring, as ureq's rustls already builds on Windows; the key's fingerprint read from the certificate with webpki.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
rustls-platform-verifier = { version = "0.7", optional = true }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["alloc", "ring", "std"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSDictionary", "NSUUID", "NSValue", "NSObject", "NSData", "NSError", "NSRunLoop", "NSObjCRuntime", "NSURL", "NSKeyValueCoding"] }
# Notifications posted as Echo (its icon; a click opens the window). osascript's show as Script Editor.
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "bitflags", "block2", "UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationTrigger"] }
# The Dock icon while the Echo window is open (dev builds have no bundle icon).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSImage"] }
objc2-core-audio = { version = "0.3", features = ["AudioHardware", "objc2", "objc2-foundation", "objc2-core-audio-types"] }
objc2-core-audio-types = "0.3"
objc2-core-foundation = { version = "0.3", features = ["CFDictionary", "CFString"] }
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }
block2 = "0.6"
# The window's webview: stopping a microphone capture no plugin holds (`window::EchoWindow::follow_mic`); a page rendered
# for a plugin (`web::render`): its own configuration, a store in memory, the gate as its proxy, a content rule list.
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKPreferences", "WKUserContentController", "WKContentRuleList", "WKContentRuleListStore"], optional = true }
libc = "0.2"
whisper-rs = { version = "0.16", features = ["metal"], optional = true }
# Shared-screen key frames: decode the window capture, compare thumbnails, save JPEGs.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.16", optional = true }

# Echo's icon in echoctl.exe (build.rs; a host dependency, so only Windows builds compile it).
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
windows-core = "0.62"
# The window's WebView2: each microphone request asked of Echo (`window::gate_media`).
webview2-com = { version = "0.39", optional = true }
windows = { version = "0.62", features = [
  "Data_Xml_Dom",
  "Foundation",
  "UI_Notifications",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Xps",
  "Win32_Media_Audio",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
] }
